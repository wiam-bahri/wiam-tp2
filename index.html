
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
        }

        main {
            margin: 50px auto;
            padding: 30px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <header>
        <h1>Bienvenue sur EduConnect</h1>
    </header>

    <main>
        <p>Plateforme académique collaborative.</p>
        <button>Découvrir la plateforme</button>
    </main>

</body>
</html>
